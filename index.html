<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ali Srouji, filmmaker and editor. Selected work." />
    <meta name="theme-color" content="#08090a" />
    <title>Ali Srouji — Filmmaker</title>
    <meta name="color-scheme" content="dark" />
    <!-- Critical: the ground is black before any stylesheet lands, so a reload
         never flashes white or shows the gate's markup unstyled. -->
    <style>
      html { background: #08090a; color-scheme: dark; }
      body { margin: 0; background: #08090a; color: #e8e9ea; }
      #gate { position: fixed; inset: 0; z-index: 60; background: #08090a; }
      #gate, .hud, .hud__bar { visibility: hidden; }
      .styled #gate, .styled .hud, .styled .hud__bar { visibility: visible; }
    </style>
  </head>
  <body data-barba="wrapper" class="is-gated">
    <!-- The gate: press Space or tap to roll. -->
    <section id="gate" class="gate" role="button" tabindex="0"
             aria-label="Press Space or tap the screen to enter the site">
      <div class="gate__frames" aria-hidden="true"></div>

      <header class="gate__top mono">
        <span class="gate__rec"><i class="gate__dot"></i>Rec</span>
        <span class="gate__tc" id="gate-tc" aria-hidden="true">00:00:00:00</span>
      </header>

      <div class="gate__mid">
        <div>
          <h1 class="gate__name"><span>Ali</span><span>Srouji</span></h1>
          <p class="gate__role mono">Filmmaker / Editor</p>
        </div>
        <p class="gate__cue mono">
          <span class="gate__key">Space</span>
          <span class="gate__cue-label">to roll</span>
          <span class="gate__cue-touch">Tap to roll</span>
        </p>
      </div>

      <div class="gate__ruler">
        <span class="gate__ticks"></span>
        <span class="gate__load" id="gate-load"></span>
        <span class="gate__playhead" id="gate-playhead"></span>
        <span class="gate__slate mono" id="gate-slate">Loading frames</span>
        <span class="gate__ratio mono">2.39:1 / 24 fps</span>
      </div>
    </section>

    <main data-barba="container" data-barba-namespace="home" class="page">
      <section class="hero" data-section data-slate="Ali Srouji / Filmmaker">
        <div class="hero__frame">
            <video id="hero-video" class="hero__video" poster="/frames/film/frame-10.jpg"
                   muted loop playsinline preload="none" aria-hidden="true"></video>
            <button id="hero-sound" class="sound sound--hero mono" type="button" aria-pressed="false">Sound off</button>
          </div>
        <div class="hero__body">
          <h2 class="hero__title"><span><i>Ali</i></span><span><i>Srouji</i></span></h2>
          <div>
            <p class="hero__note">Short films and music videos, written, shot and cut. Latest: <em>Chase Me Down to Main Street</em>.</p>
            <a class="hero__cta mono" href="#work">View the reel</a>
          </div>
        </div>
      </section>

      <h2 class="sr-only">Reels</h2>
      <section class="work" id="reels"></section>
    </main>

    <div class="bars" aria-hidden="true">
      <span class="bars__bar bars__bar--top"></span>
      <span class="bars__bar bars__bar--bottom"></span>
    </div>
    <div class="flash" aria-hidden="true"></div>
    <div class="film-vignette" aria-hidden="true"></div>
    <div class="film-grain" aria-hidden="true"></div>

    <div class="hud mono">
      <span class="hud__tc" id="hud-tc" aria-hidden="true">00:00:00:00</span>
      <span class="hud__right">
        <span class="hud__meta" aria-hidden="true">Chase Me Down to Main Street / 2025</span>
        <!-- TODO: swap in Ali's handle, in the href and in the label. -->
        <a class="social" id="social-ig" href="https://www.instagram.com/"
           target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="5" />
            <circle cx="12" cy="12" r="4.2" />
            <circle cx="17.3" cy="6.7" r="0.9" />
          </svg>
          <span class="social__handle">Instagram</span>
        </a>
      </span>
    </div>
    <div class="hud__bar" aria-hidden="true"><span class="hud__fill" id="hud-fill"></span></div>


    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
